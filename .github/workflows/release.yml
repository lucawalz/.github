name: release

on:
  workflow_call:
    inputs:
      goreleaser:
        description: Run GoReleaser against the new tag when a release is created
        required: false
        type: boolean
        default: false
      attest-subject-path:
        description: Glob of release assets, downloaded into dist/, to attest; empty skips attestation
        required: false
        type: string
        default: ""
    secrets:
      RELEASE_APP_ID:
        required: true
      RELEASE_APP_PRIVATE_KEY:
        required: true
    outputs:
      release-created:
        description: Whether release-please created a release
        value: ${{ jobs.release.outputs.release-created }}
      tag-name:
        description: Tag of the created release
        value: ${{ jobs.release.outputs.tag-name }}

permissions:
  contents: read

env:
  GORELEASER_VERSION: v2.20.0
  RELEASED_LABEL: released
  RELEASE_BRANCH_PREFIX: release-please--
  BUNDLE_NAME: attestation.sigstore.json

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      release-created: ${{ steps.release-please.outputs.release_created || 'false' }}
      tag-name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          [ -n "$APP_ID" ] && [ -n "$APP_KEY" ] || { echo "release App secrets missing" >&2; exit 1; }
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  goreleaser:
    needs: release
    if: needs.release.outputs.release-created == 'true' && inputs.goreleaser
    runs-on: ubuntu-24.04
    steps:
      - env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          [ -n "$APP_ID" ] && [ -n "$APP_KEY" ] || { echo "release App secrets missing" >&2; exit 1; }
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag-name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  attest:
    needs: [release, goreleaser]
    if: >-
      !cancelled() && needs.release.outputs.release-created == 'true'
      && inputs.attest-subject-path != '' && needs.goreleaser.result != 'failure'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          [ -n "$APP_ID" ] && [ -n "$APP_KEY" ] || { echo "release App secrets missing" >&2; exit 1; }
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag-name }}
        run: gh release download "$TAG" --dir dist
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ inputs.attest-subject-path }}
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag-name }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" "$RUNNER_TEMP/$BUNDLE_NAME"
          gh release upload "$TAG" "$RUNNER_TEMP/$BUNDLE_NAME"

  publish:
    needs: [release, goreleaser, attest]
    if: >-
      !cancelled() && needs.release.outputs.release-created == 'true'
      && needs.goreleaser.result != 'failure' && needs.attest.result != 'failure'
    runs-on: ubuntu-24.04
    steps:
      - env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          [ -n "$APP_ID" ] && [ -n "$APP_KEY" ] || { echo "release App secrets missing" >&2; exit 1; }
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag-name }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$TAG" --draft=false
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: comment-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-issues: write
      - env:
          GH_TOKEN: ${{ steps.comment-token.outputs.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag-name }}
          CLOSING_ISSUES_QUERY: >-
            query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) {
            pullRequest(number: $number) {
            closingIssuesReferences(first: 100) { nodes { number repository { nameWithOwner } } }
            } } }
        run: |
          shopt -s inherit_errexit
          if ! prev="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null)"; then
            echo "no tag before $TAG, nothing to comment"
            exit 0
          fi
          export BODY="Released in [$TAG]($GITHUB_SERVER_URL/$REPO/releases/tag/$TAG)."

          mark_released() {
            local number="$1" existing
            existing="$(gh api --paginate "repos/$REPO/issues/$number/comments?per_page=100" --jq '.[] | select(.body == env.BODY) | .id')"
            if [ -z "$existing" ]; then
              gh api -X POST "repos/$REPO/issues/$number/comments" -f body="$BODY" --silent
            fi
            gh api -X POST "repos/$REPO/issues/$number/labels" -f "labels[]=$RELEASED_LABEL" --silent
          }

          prs="$(git rev-list "$prev..$TAG" | while read -r sha; do
            gh api "repos/$REPO/commits/$sha/pulls" \
              --jq '.[] | select(.merged_at != null and (.head.ref | startswith(env.RELEASE_BRANCH_PREFIX) | not)) | .number'
          done | sort -nu)"

          issues=""
          for pr in $prs; do
            mark_released "$pr"
            issues+="$(gh api graphql -F owner="${REPO%%/*}" -F name="${REPO#*/}" -F number="$pr" -f query="$CLOSING_ISSUES_QUERY" \
              --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[] | select(.repository.nameWithOwner == env.REPO) | .number')"$'\n'
          done

          sort -nu <<<"$issues" | while read -r issue; do
            [ -z "$issue" ] || mark_released "$issue"
          done
