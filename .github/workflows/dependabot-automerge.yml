name: dependabot-automerge

on:
  workflow_call:
    inputs:
      update-types:
        description: Comma-separated semver update types eligible for automerge
        required: false
        type: string
        default: semver-minor,semver-patch

permissions:
  contents: read

env:
  UPDATE_TYPE_PREFIX: "version-update:"

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ALLOWED_TYPES: ${{ inputs.update-types }}
        run: |
          type="${UPDATE_TYPE#"$UPDATE_TYPE_PREFIX"}"
          case ",${ALLOWED_TYPES// /}," in
            *",$type,"*) gh pr merge --auto --squash "$PR_URL" ;;
            *) echo "update type $type is not eligible for automerge" ;;
          esac
