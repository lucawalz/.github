name: Bug report
description: Report something that does not work as documented.
type: bug
labels:
  - needs-triage
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what was expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The exact steps, commands or configuration that trigger the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release, tag or commit in use.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture and any other relevant platform details.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output, with secrets removed.
      render: text
